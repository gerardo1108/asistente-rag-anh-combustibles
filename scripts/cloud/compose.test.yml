services:
  backend-anh:
    build:
      context: ../../asistente-anh
      dockerfile: src/sistemas_externos/backend_anh/Dockerfile
    ports: ["127.0.0.1:${BACKEND_HOST_PORT:-8001}:8001"]
    environment:
      PERMITIR_REINICIO: "false"
      ANH_DB_PATH: /app/datos/backend_anh.db
    volumes: ["backend-datos:/app/datos"]
    restart: unless-stopped
  ciudadania-digital:
    build:
      context: ../../asistente-anh
      dockerfile: src/sistemas_externos/ciudadania_digital/Dockerfile
    ports: ["127.0.0.1:${CIUDADANIA_HOST_PORT:-8002}:8002"]
    environment:
      PERMITIR_REINICIO: "false"
      CD_DB_PATH: /app/datos/ciudadania_digital.db
    volumes: ["ciudadania-datos:/app/datos"]
    restart: unless-stopped
  rag:
    build:
      context: ../../asistente-anh
      dockerfile: src/rag/Dockerfile
    ports: ["127.0.0.1:${RAG_HOST_PORT:-8003}:8003"]
    env_file: [../../asistente-anh/.env]
    restart: unless-stopped
  chat:
    build:
      context: ../../asistente-anh
      dockerfile: src/chat_web/Dockerfile
    ports: ["127.0.0.1:${CHAT_HOST_PORT:-8080}:8080"]
    environment:
      BACKEND_URL: "http://backend-anh:8001"
      CIUDADANIA_URL: "http://ciudadania-digital:8002"
      RAG_URL: "http://rag:8003"
    restart: unless-stopped
volumes:
  backend-datos:
  ciudadania-datos:
