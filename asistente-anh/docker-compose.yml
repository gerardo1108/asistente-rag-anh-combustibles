services:
  backend-anh:
    build:
      context: .
      dockerfile: src/sistemas_externos/backend_anh/Dockerfile
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      PERMITIR_REINICIO: "true"
      ANH_DB_PATH: /app/datos/backend_anh.db
    volumes:
      - ./semillas:/app/semillas:ro
      - backend-datos:/app/datos

  ciudadania-digital:
    build:
      context: .
      dockerfile: src/sistemas_externos/ciudadania_digital/Dockerfile
    ports:
      - "${CIUDADANIA_PORT:-8002}:8002"
    environment:
      PERMITIR_REINICIO: "true"
      CD_DB_PATH: /app/datos/ciudadania_digital.db
    volumes:
      - ./semillas:/app/semillas:ro
      - ciudadania-datos:/app/datos

  rag:
    build:
      context: .
      dockerfile: src/rag/Dockerfile
    ports:
      - "${RAG_PORT:-8003}:8003"
    # Reenvía todo lo que haya en .env (GOOGLE_API_KEY, GROQ_API_KEY y
    # cualquier override opcional como LLM_PROVEEDORES/GEMINI_MODEL/
    # GROQ_MODEL) sin tener que declarar cada variable acá. Si falta una
    # clave requerida, `configuracion.py` falla al arrancar con un mensaje
    # claro, igual que antes.
    env_file:
      - .env

  chat:
    build:
      context: .
      dockerfile: src/chat_web/Dockerfile
    ports:
      - "${CHAT_PORT:-8081}:8080"
    environment:
      BACKEND_PORT: "${BACKEND_PORT:-8001}"
      CIUDADANIA_PORT: "${CIUDADANIA_PORT:-8002}"
      RAG_PORT: "${RAG_PORT:-8003}"

volumes:
  backend-datos:
  ciudadania-datos:
